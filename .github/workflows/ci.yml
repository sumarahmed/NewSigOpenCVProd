name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\StaticSignatureVerification.sln

      - name: Build
        run: dotnet build .\StaticSignatureVerification.sln -c Release --no-restore -m:1

      - name: Run regression harness
        run: dotnet .\StaticSignatureVerification.Tests\bin\Release\net8.0\StaticSignatureVerification.Tests.dll
